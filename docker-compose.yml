services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oversee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oversee}
      POSTGRES_DB: ${POSTGRES_DB:-oversee}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oversee} -d ${POSTGRES_DB:-oversee}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn oversee.api.main:app --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oversee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oversee}
      POSTGRES_DB: ${POSTGRES_DB:-oversee}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
