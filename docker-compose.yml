x-app-env: &app-env
  POSTGRES_USER: ${POSTGRES_USER:-oversee}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oversee}
  POSTGRES_DB: ${POSTGRES_DB:-oversee}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oversee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oversee}
      POSTGRES_DB: ${POSTGRES_DB:-oversee}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oversee} -d ${POSTGRES_DB:-oversee}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for the raw data lake (s3://oversee-lake).
  # Development credentials are in docker/seaweedfs/s3.json; buckets are created on first
  # write. Browse files at http://localhost:8888/buckets/
  # Small volumes without preallocation: the defaults reserve about 1 GB of disk per volume
  # file (14 GB for one day of data), which counts against Docker's disk image.
  lake:
    image: chrislusf/seaweedfs:3.80
    command: >-
      server -ip.bind=0.0.0.0 -dir=/data -volume.max=0
      -master.volumeSizeLimitMB=256 -master.volumePreallocate=false
      -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - lakedata:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Applies pending Alembic revisions, then exits
  migrate:
    build: .
    command: oversee-db upgrade
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: uvicorn oversee.api.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
  lakedata:
