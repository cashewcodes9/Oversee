[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oversee"
version = "0.1.0"
description = "Port Activity Intelligence Platform: vessel traffic and port KPIs from open AIS data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "duckdb>=1.1",
    "zstandard>=0.22",
    "websockets>=13",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.33",
    "plotly>=5.20",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "invoke>=2.2",
]

[project.scripts]
oversee-etl = "oversee.etl.cli:main"
oversee-db = "oversee.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oversee = ["migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
